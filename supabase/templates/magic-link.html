<!DOCTYPE html>
<html xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <meta name="supported-color-schemes" content="light" />
  <title>Your Ultaura sign-in link</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap');</style>
  <!--[if mso]><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch><o:AllowPNG/></o:OfficeDocumentSettings></xml><![endif]-->
</head>
<body style="background-color: #FAFAF9; margin: 0; padding: 0; font-family: Manrope, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <div style="display: none; max-height: 0; overflow: hidden; mso-hide: all;">Your secure sign-in link for Ultaura</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin: 0; padding: 0;">
    <tr>
      <td align="center" style="padding: 32px 0;">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width: 560px; width: 100%; background-color: #FFFFFF; border: 1px solid #E7E5E4; border-radius: 8px; padding: 24px;">
          <tr>
            <td style="padding: 4px 0 16px 0;">
              <table cellpadding="0" cellspacing="0" role="presentation" style="border: none;">
                <tr>
                  <td style="vertical-align: middle; padding-right: 10px;">
                    <img src="{{ .SiteURL }}/logos/logo-email.png" width="36" height="36" alt="Ultaura" style="display: block;" />
                  </td>
                  <td style="vertical-align: middle;">
                    <span style="font-size: 18px; font-weight: 600; color: #0ABAB5; line-height: 1; letter-spacing: -0.01em;">Ultaura</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td>
              <h1 style="font-size: 22px; font-weight: 600; color: #1C1917; margin: 0; text-align: center;">Your sign-in link</h1>
            </td>
          </tr>
          <tr>
            <td style="padding-top: 16px;">
              <p style="font-size: 14px; color: #44403C; margin: 0;">Click below to sign in. This link expires in 10 minutes.</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding: 20px 0;">
              <!--[if mso]><v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" href="{{ .ConfirmationURL }}" style="height:36px;v-text-anchor:middle;width:120px;" arcsize="11%" stroke="f" fillcolor="#0ABAB5"><w:anchorlock/><center style="color:#FFFFFF;font-family:Manrope,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;">Sign In</center></v:roundrect><![endif]-->
              <!--[if !mso]><!--><a href="{{ .ConfirmationURL }}" style="display: inline-block; background-color: #0ABAB5; color: #FFFFFF; font-size: 12px; font-weight: 600; text-decoration: none; padding: 12px 20px; border-radius: 4px;">Sign In</a><!--<![endif]-->
            </td>
          </tr>
          <tr>
            <td style="padding-bottom: 20px;">
              <p style="font-size: 14px; color: #44403C; margin: 18px 0 0 0;">- The Ultaura Team</p>
            </td>
          </tr>
          <tr>
            <td style="padding-top: 20px; border-top: 1px solid #E7E5E4;">
              <p style="font-size: 12px; color: #78716C; margin: 8px 0 0 0; text-align: center;">Companionship, one call at a time.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
