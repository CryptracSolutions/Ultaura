    <g transform="translate(18 16)" fill="#3B82F6" fill-opacity="0.95">
      <rect x="0" y="12" width="6" height="12" rx="3"/>
      <rect x="12" y="6" width="6" height="24" rx="3"/>
      <rect x="24" y="0" width="6" height="36" rx="3"/>
      <rect x="36" y="8" width="6" height="20" rx="3"/>
      <rect x="48" y="14" width="6" height="10" rx="3"/>
    </g>
    <text x="78" y="35" font-family="Manrope, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="18" font-weight="700" fill="#FFFFFF" fill-opacity="0.92" text-anchor="middle">Eve</text>
  </g>
