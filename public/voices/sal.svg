      <stop offset="0" stop-color="#A855F7" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#0ABAB5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0ABAB5" stop-opacity="0"/>
