<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <!-- Background circle glow -->
  <circle cx="150" cy="150" r="120" fill="#0ABAB5" fill-opacity="0.05"/>
  <circle cx="150" cy="150" r="90" fill="#0ABAB5" fill-opacity="0.08"/>

  <!-- Central clipboard/document -->
  <g transform="translate(100, 60)">
    <!-- Clipboard body -->
    <rect x="10" y="20" width="80" height="110" rx="6" fill="#0ABAB5" fill-opacity="0.1" stroke="#0ABAB5" stroke-width="2"/>
    <!-- Clipboard clip -->
    <rect x="35" y="12" width="30" height="16" rx="3" fill="#0ABAB5" fill-opacity="0.2" stroke="#0ABAB5" stroke-width="1.5"/>
    <!-- Checklist lines with checkmarks -->
    <g stroke="#0ABAB5" stroke-width="1.5" stroke-linecap="round">
      <!-- Item 1 - checked -->
      <rect x="22" y="45" width="12" height="12" rx="2" fill="#0ABAB5" fill-opacity="0.15"/>
      <path d="M25,51 L28,54 L33,48" stroke-width="2"/>
      <line x1="40" y1="51" x2="75" y2="51" stroke-opacity="0.4"/>
      <!-- Item 2 - checked -->
      <rect x="22" y="65" width="12" height="12" rx="2" fill="#0ABAB5" fill-opacity="0.15"/>
      <path d="M25,71 L28,74 L33,68" stroke-width="2"/>
      <line x1="40" y1="71" x2="70" y2="71" stroke-opacity="0.4"/>
      <!-- Item 3 - checked -->
      <rect x="22" y="85" width="12" height="12" rx="2" fill="#0ABAB5" fill-opacity="0.15"/>
      <path d="M25,91 L28,94 L33,88" stroke-width="2"/>
      <line x1="40" y1="91" x2="72" y2="91" stroke-opacity="0.4"/>
      <!-- Item 4 - checked -->
      <rect x="22" y="105" width="12" height="12" rx="2" fill="#0ABAB5" fill-opacity="0.15"/>
      <path d="M25,111 L28,114 L33,108" stroke-width="2"/>
      <line x1="40" y1="111" x2="68" y2="111" stroke-opacity="0.4"/>
    </g>
  </g>

  <!-- Orbiting expertise nodes -->
  <!-- Top node - stethoscope (medical) -->
  <g transform="translate(195, 70)">
    <circle cx="20" cy="20" r="22" fill="#0ABAB5" fill-opacity="0.12" stroke="#0ABAB5" stroke-width="1.5"/>
    <path d="M15,15 Q15,25 20,28 Q25,25 25,15" stroke="#0ABAB5" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="20" cy="30" r="3" fill="#0ABAB5" fill-opacity="0.4"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- Left node - heart (caregivers) -->
  <g transform="translate(45, 130)">
    <circle cx="20" cy="20" r="22" fill="#0ABAB5" fill-opacity="0.12" stroke="#0ABAB5" stroke-width="1.5"/>
    <path d="M20,28 L13,21 C8,16 8,10 13,7 C18,4 22,7 20,13 C18,7 22,4 27,7 C32,10 32,16 27,21 Z"
          fill="#0ABAB5" fill-opacity="0.3" stroke="#0ABAB5" stroke-width="1.5"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </g>

  <!-- Right node - ear/listening (seniors input) -->
  <g transform="translate(215, 160)">
    <circle cx="20" cy="20" r="22" fill="#0ABAB5" fill-opacity="0.12" stroke="#0ABAB5" stroke-width="1.5"/>
    <path d="M22,10 Q30,12 30,22 Q30,32 22,32 L22,28 Q26,28 26,22 Q26,16 22,14 Z"
          fill="#0ABAB5" fill-opacity="0.3" stroke="#0ABAB5" stroke-width="1.5"/>
    <path d="M16,18 Q20,16 20,22 Q20,28 16,26" stroke="#0ABAB5" stroke-width="1.5" fill="none"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="3s" begin="1s" repeatCount="indefinite"/>
  </g>

  <!-- Bottom node - accessibility symbol -->
  <g transform="translate(100, 200)">
    <circle cx="20" cy="20" r="22" fill="#0ABAB5" fill-opacity="0.12" stroke="#0ABAB5" stroke-width="1.5"/>
    <!-- Simplified person in wheelchair hint -->
    <circle cx="20" cy="14" r="4" fill="#0ABAB5" fill-opacity="0.4"/>
    <path d="M20,18 L20,26 M15,22 L25,22 M17,26 Q17,32 22,32" stroke="#0ABAB5" stroke-width="2" fill="none" stroke-linecap="round"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </g>

  <!-- Connection lines from nodes to clipboard -->
  <g stroke="#0ABAB5" stroke-width="1.5" stroke-dasharray="4 4" fill="none" stroke-linecap="round">
    <path d="M195,95 Q175,100 175,90" stroke-opacity="0.3"/>
    <path d="M85,150 Q100,145 110,140" stroke-opacity="0.3"/>
    <path d="M215,180 Q195,175 185,165" stroke-opacity="0.3"/>
    <path d="M120,220 Q130,200 140,185" stroke-opacity="0.3"/>
  </g>

  <!-- Decorative sparkles around clipboard -->
  <g fill="#0ABAB5">
    <circle cx="205" cy="55" r="2" fill-opacity="0.3">
      <animate attributeName="fill-opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="85" cy="95" r="2" fill-opacity="0.25">
      <animate attributeName="fill-opacity" values="0.25;0.5;0.25" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="190" cy="135" r="2.5" fill-opacity="0.2">
      <animate attributeName="fill-opacity" values="0.2;0.45;0.2" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
