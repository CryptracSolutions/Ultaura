<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <!-- Background circle glow -->
  <circle cx="150" cy="150" r="120" fill="#0ABAB5" fill-opacity="0.05"/>
  <circle cx="150" cy="150" r="90" fill="#0ABAB5" fill-opacity="0.08"/>

  <!-- Senior figure (left) -->
  <g transform="translate(60, 100)">
    <!-- Head -->
    <circle cx="30" cy="25" r="22" fill="#0ABAB5" fill-opacity="0.15" stroke="#0ABAB5" stroke-width="2"/>
    <!-- Body -->
    <path d="M10,55 Q10,75 20,90 L40,90 Q50,75 50,55 L30,50 L10,55 Z" fill="#0ABAB5" fill-opacity="0.12" stroke="#0ABAB5" stroke-width="1.5"/>
    <!-- Phone held to ear -->
    <rect x="45" y="20" width="8" height="18" rx="2" fill="#0ABAB5" fill-opacity="0.3" stroke="#0ABAB5" stroke-width="1.5"/>
  </g>

  <!-- Family figure (right) -->
  <g transform="translate(180, 100)">
    <!-- Head -->
    <circle cx="30" cy="25" r="22" fill="#0ABAB5" fill-opacity="0.15" stroke="#0ABAB5" stroke-width="2"/>
    <!-- Body -->
    <path d="M10,55 Q10,75 20,90 L40,90 Q50,75 50,55 L30,50 L10,55 Z" fill="#0ABAB5" fill-opacity="0.12" stroke="#0ABAB5" stroke-width="1.5"/>
    <!-- Phone held to ear (mirrored) -->
    <rect x="7" y="20" width="8" height="18" rx="2" fill="#0ABAB5" fill-opacity="0.3" stroke="#0ABAB5" stroke-width="1.5"/>
  </g>

  <!-- Connection waves between figures -->
  <g stroke="#0ABAB5" stroke-width="1.5" fill="none" stroke-linecap="round">
    <!-- Wave lines representing voice/connection -->
    <path d="M120,130 Q150,115 180,130" stroke-opacity="0.6">
      <animate attributeName="stroke-opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M125,140 Q150,125 175,140" stroke-opacity="0.4">
      <animate attributeName="stroke-opacity" values="0.4;0.2;0.4" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M130,150 Q150,138 170,150" stroke-opacity="0.3">
      <animate attributeName="stroke-opacity" values="0.3;0.1;0.3" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Heart in center -->
  <path d="M150,165 L143,158 C138,153 138,145 143,140 C148,135 155,137 150,145 C145,137 152,135 157,140 C162,145 162,153 157,158 Z"
        fill="#0ABAB5" fill-opacity="0.25" stroke="#0ABAB5" stroke-width="1.5"/>

  <!-- Decorative dots -->
  <circle cx="100" cy="80" r="3" fill="#0ABAB5" fill-opacity="0.2"/>
  <circle cx="200" cy="80" r="3" fill="#0ABAB5" fill-opacity="0.2"/>
  <circle cx="150" cy="230" r="4" fill="#0ABAB5" fill-opacity="0.15"/>
</svg>
