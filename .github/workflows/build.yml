name: 🚀 Build
on:
  push:
    branches:
      - main
      - dev
  pull_request: {}

permissions:
  actions: write
  contents: read

jobs:
  lint:
    name: ⬣ ESLint
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - name: 🛑 Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1

      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⬇️ Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔬 Lint
        run: pnpm lint

  sensitive-logs-check:
    name: Sensitive Logs Check
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check for sensitive data logging
        run: |
          chmod +x scripts/check-sensitive-logs.sh
          ./scripts/check-sensitive-logs.sh telephony/src

  typecheck:
    name: ʦ TypeScript
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - name: 🛑 Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1

      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⬇️ Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Content
        run: pnpm exec contentlayer build

      - name: Validate newsletter env contract
        run: |
          rg '^RESEND_SEGMENT_ID=' .env.ultaura.example
          rg '^RESEND_TOPIC_BLOG_DIGEST_ID=' .env.ultaura.example
          rg '^RESEND_TOPIC_ELDER_CARE_TIPS_ID=' .env.ultaura.example
          rg '^RESEND_TOPIC_PRODUCT_UPDATES_ID=' .env.ultaura.example
          rg '^ULTAURA_LOG_PII_KEY=' .env.ultaura.example

      - name: 🔎 Type check
        run: |
          pnpm typecheck --if-present
          pnpm --filter @ultaura/telephony typecheck

  test:
    name: ⚫️ Test
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    env:
      SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ENABLE_STRIPE_TESTING: ${{ vars.ENABLE_STRIPE_TESTING }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

    steps:
      - name: 🛑 Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1

      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⬇️ Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cypress Binary
        id: cache-cypress-binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: binary-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Stop Supabase (if running)
        continue-on-error: true
        id: supabase-stop
        run: supabase stop -- --no-backup

      - name: Start Supabase
        id: supabase-start
        run: pnpm supabase:start -- -x studio,migra,deno-relay,pgadmin-schema-diff,imgproxy,logflare

      - name: Environment variables
        uses: aarcangeli/load-dotenv@v1.0.0
        with:
          filenames: |
            .env.test
          quiet: true
          if-file-not-found: error

      - name: Test DB (pre-unit)
        if: steps.supabase-start.outputs.exit_code == 0
        run: pnpm test:reset:db

      - name: 🔎 Unit tests (app + telephony)
        if: steps.supabase-start.outputs.exit_code == 0
        run: |
          pnpm test:unit
          pnpm --filter @ultaura/telephony test

      - name: Test DB (pre-e2e)
        if: steps.supabase-start.outputs.exit_code == 0
        run: pnpm test:reset:db

      - name: 🔎 Cypress
        if: steps.supabase-start.outputs.exit_code == 0
        env:
          SUPABASE_ALREADY_RUNNING: "true"
        run: pnpm test:e2e build

      - name: Archive test screenshots
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: screenshots
          path: ./cypress/screenshots/
          retention-days: 2

      - name: Stop Docker (if running)
        continue-on-error: true
        if: always()
        id: docker-stop
        run: docker kill $(docker ps -q)
